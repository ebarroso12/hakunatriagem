# Regressão 1.5: documento opaco solicita impressão e confirma por mensagem autenticada.
name: Entregar HTML baixável
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/deliver-html.yml]
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Preparar Chromium para teste com dados sintéticos
        run: npx playwright install --with-deps chromium
      - name: Testar HTML real offline em Chromium
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e "import {chromium} from '@playwright/test'; process.stdout.write(chromium.executablePath())")"
          node tests/browser-file.mjs
      - name: Publicar somente o HTML testado como arquivo de download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="html-${GITHUB_SHA:0:12}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/Triagem-Hakunas-Corrigida.html --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/Triagem-Hakunas-Corrigida.html --target "$GITHUB_SHA" --title 'Triagem Hakunas — HTML offline corrigido' --notes 'Arquivo HTML único offline. Versão 1.5: relatórios completos e faltantes em XLSX, CSV, ODS, PDF real ou HTML; impressão visível, alertas de lacunas por participante e seleção de destino. Drive depende do seletor/compartilhamento do sistema, sem upload automático. Gerado após testes e E2E em Chromium offline, somente dados fictícios; sem homologação Android físico, diálogo nativo de salvar, Drive real ou impressora.' --latest --repo "$GITHUB_REPOSITORY"
          fi
