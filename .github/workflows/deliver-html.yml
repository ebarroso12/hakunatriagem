# Regressão 1.8: auditoria funcional; seletores hospedados limitados à lista visível.
name: Entregar HTML baixável
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/deliver-html.yml]
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Preparar Chromium para teste com dados sintéticos
        run: npx playwright install --with-deps chromium
      - name: Testar HTML real offline em Chromium
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e "import {chromium} from '@playwright/test'; process.stdout.write(chromium.executablePath())")"
          node tests/browser-file.mjs
          node tests/browser-hosted-audit.mjs
      - name: Publicar somente o HTML testado como arquivo de download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="html-${GITHUB_SHA:0:12}"
          hakunas_version="$(node -p 'require("./package.json").version')"
          hakunas_html="dist/Triagem-Hakunas-v${hakunas_version}.html"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/Triagem-Hakunas-Corrigida.html "$hakunas_html" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/Triagem-Hakunas-Corrigida.html "$hakunas_html" --target "$GITHUB_SHA" --title 'Triagem Hakunas — HTML offline corrigido' --notes 'Arquivo HTML único offline. Versão 1.8: auditoria e correções de impressão/validação/importação/backup, prévia do relatório e versões preservadas; lista de localização com busca por nome, filtro verde/amarelo/vermelho/preto e ordenação; relatórios completos e faltantes em XLSX, CSV, ODS, PDF real ou HTML; impressão visível, alertas de lacunas por participante e seleção de destino. Drive depende do seletor/compartilhamento do sistema, sem upload automático. Gerado após testes e E2E em Chromium offline, somente dados fictícios; sem homologação Android físico, diálogo nativo de salvar, Drive real ou impressora.' --latest --repo "$GITHUB_REPOSITORY"
          fi
